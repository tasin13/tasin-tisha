<html lang="en">

:root{--bg:#f4efe7;--fg:#2a2622;--panel:rgba(255,252,246,.9)}

:root[data-theme="dark"]{--bg:#14120f;--fg:#efe8dc;--panel:rgba(30,27,23,.9)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
.ui{position:fixed;left:0;right:0;padding:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;pointer-events:none;z-index:5}
#top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#bot{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.pill{background:var(--panel);padding:8px 14px;border-radius:99px;font-size:14px;pointer-events:auto;backdrop-filter:blur(6px);border:0;color:var(--fg);font-family:inherit;cursor:pointer}
#hint{opacity:.85;pointer-events:none;font-size:12px}
@media(max-width:760px){#hint{display:none}}
#pick{position:fixed;inset:0;background:rgba(10,8,6,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;color:#fff;font-size:22px}
#pick button{font:inherit;padding:14px 26px;border-radius:14px;border:0;cursor:pointer;width:240px}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:18px;border-radius:16px;display:none;z-index:15;min-width:280px;max-height:70vh;overflow:auto}
#panel .row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
#panel i{width:18px;height:18px;border-radius:50%;display:inline-block}
#panel h3{margin:0 0 8px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:99px;display:none;z-index:16}
</style>
</head>
